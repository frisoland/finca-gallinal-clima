name: Informe diario Telegram

on:
  workflow_dispatch:   
  

jobs:
  enviar-informe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24" "requests>=2.31"  "pyarrow>=15.0" "openpyxl>=3.1"

      - name: Generar y enviar el informe
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SENCROP_APP_ID:     ${{ secrets.SENCROP_APP_ID }}
          SENCROP_APP_SECRET: ${{ secrets.SENCROP_APP_SECRET }}
          SENCROP_USER_ID:    ${{ secrets.SENCROP_USER_ID }}
          VEGGA_USERNAME: ${{ secrets.VEGGA_USERNAME }}
          VEGGA_PASSWORD: ${{ secrets.VEGGA_PASSWORD }}
        run: python scripts/daily_report.py
